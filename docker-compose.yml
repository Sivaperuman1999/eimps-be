version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: eimps_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: eimps_backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/eimps
      - PORT=8001
    depends_on:
      - mongodb

volumes:
  mongo_data:
